# A 股个人交易提醒系统 · 采集与决策配置
# 免费源离线自检用 fixture / fixture_alt；联网后把 primary 改成 adata，backup 改成 akshare。

project:
  name: ashare-collector
  spec_version: "1.1"
  # v1.2：上方无阻力带时按保守倍数处理，不再跳过盈亏比检查
  # v1.3：用期望值（胜率×盈亏比）替代纯盈亏比；结构位太远时退到 ATR 止损，不再整只票否决
  # v1.4：异动按阴阳拆成两条；条件加 priority（多标签命中时决定主标签，记录一条不删）
  feature_version: "v1.4"
  db_path: data/market.db
  timezone: Asia/Shanghai

watchlist:
  indices: [SZ399006]
  etfs: [SH510500, SH588000, SH588200]
  stocks: [SZ000333, SZ000063, SH600487, SH600606, SH600584]
  # 实际持仓（只填个股代码）。只有列在这里的才算"持仓"，其余个股算"观察"。
  # 区别只有一个但很重要：出池提示只对"观察"里的个股生效——
  # 持仓的去留由仓位和你自己的判断决定，不该被"最近没出现形态"赶走。
  holdings: []

# 标的池：筛选和回测**共用**的成交额门槛（小票要带镣铐）。
# 本地仓库是全市场同步来的，里面躺着大量一天只成交几百万的票：它们不是机会，
# 是成交不了、复权数据也经不起看的噪声。回测若放它们进来，等于专门去挑
# "事后涨得最猛"的幽灵票，结论会系统性偏乐观。指数不参与这道过滤（没有成交额可比）。
# 实测（本机 2026-09 数据）：3000 万剔除约 480 只，5000 万约 1100 只。设 0 表示不过滤。
universe:
  min_avg_amount_60d: 30000000   # 近 60 个交易日日均成交额下限，单位：元
  # 指数要不要进筛选/回测的标的池。默认 false，两个理由：
  #   1) 指数没有成交额可比，拿它过流动性门槛等于永远免检；
  #   2) 回测的基准是"同一批标的里随便买一只"，指数混进来会把基准和信号都带偏。
  # 想看指数形态就把它加进观察池，或者把这里改成 true。
  include_index: false

sources:
  # 实测（2026-09-16，本机网络）：
  #   tencent  ✅ 沪深京都能取、支持前复权、一次请求可批量问实时价
  #   baostock ❌ 走非标准端口 10030，且匿名登录有 IP 限流（登录太频繁被拉黑）
  #   akshare  ❌ 日线接口走东财 push2his，本网络连接直接被断（换 UA 也无效）
  primary: tencent
  backup: baostock
  fallback: akshare
  # 只给全市场同步用的补充源（不参与主备交叉校验，避免复权口径不一致造成误报）：
  # 新浪能拿到北交所的历史，代价是不复权。
  # sse / szse 是两个交易所：只提供 ETF 份额这类交易所口径的数据。
  # 东财那条路在这网络被切，所以 ETF 份额不依赖 akshare——直接问交易所，
  # 而且交易所的数字比聚合源的估算值准（两边对同一只 ETF 能差 10%）。
  extra: [sina, sse, szse]
  min_interval_sec: 0.5   # 免费源请求间隔下限
  # 全市场代码表：这几个源的结果**并起来**用，不是第一个成功就收工。
  # 实测覆盖：sina 5564 只（唯一有北交所）、baostock 7401 行（有 ETF 和指数、没有北交所）、
  # akshare 走东财（本网络不通，换台机器可能是它最全）。
  directory: [sina, baostock, akshare]

collection:
  daily_after: "15:30"
  intraday_interval_min: 5
  tail_boost_after: "14:30"   # 尾盘提升到 1 分钟
  intraday_period: 30
  keep_intraday_days: 250
  factor_keep_days: 500       # 因子贡献保留多少个交易日（审计与影子因子准入都要用）

validation:
  price_tol: 0.003            # 双源收盘价差异上限 0.3%
  amount_tol: 0.03            # 双源成交额差异上限 3%
  # 涨跌幅跳变（判断"这根是不是脏数据"）：现在按**当天的法定幅度**算，不再一刀切。
  # 主板 10%、创业板科创板 20%、北交所 30%、主板 ST 5%；上市头几天不设限
  # （创业板科创板前 5 个交易日、北交所首日），那几天只拦明显离谱的数据。
  jump_tol_pct: 1.0           # 在法定幅度上加的容差（四舍五入到分造成的零点几个百分点）
  jump_pct_limit_unlimited: 300.0   # 不设涨跌幅的日子：只拦超过这个幅度的
  jump_pct_limit: 11.0        # 兜底值：拿不到标的身份时用（老口径）
  volume_anomaly_ratio: 10.0  # 成交额超过 20 日均值倍数只标记不阻断
  # 主源没有、备份源有的字段：按白名单从备份源补齐。
  # 换手率只有 baostock 给（腾讯、新浪都不给），不补的话数据走腾讯的那些天它就是空的。
  # 只放"与复权基准无关"的比率字段——价格和成交量绝不能混源，一混就是一段序列两把尺子。
  fill_fields: [turnover_rate]
  critical_codes: [SH000300]  # 缺失即冻结当日自动提醒

state:
  enter_up: 70
  exit_up: 55
  enter_down: 30
  exit_down: 45
  confirm_days: 2             # 连续确认天数
  min_state_days: 3           # 最短持续期
  neutral_band: 0.10          # 默认沉默带：分数落在 0.5±0.10 判为不确定

levels:
  bins: 30
  top_bins: 6
  merge_gap_pct: 0.5
  max_levels: 4

alerts:
  budget_p1: 3                # 每天 P1 提醒上限
  cooldown_minutes_p0: 15
  cooldown_days_p1: 1
  cooldown_days_p2: 5
  # 关键位置上的 K 线形态提醒（关掉就完全不产生这类提醒）。
  # 定级用三条独立门槛（形态本身没有方向，位置和量能才有）：
  #   ① 关键位置：20 日区间边缘 / 破 20 日高低 / 贴或穿越均线 / 20 日极值分型；
  #   ② 状态前提：看涨信号出现在上升趋势里只是延续，不算反转（看跌同理）；
  #   ③ 量能：反转 + 放量 → P1；组合形态或放量单根 → P2；平量的单根只画图不打扰。
  #      （"放量"的门槛复用形态层那一份，不在两处各写一个数。）
  # 实测（8 只标的 × 120 个交易日）：P1 约 30 次、P2 约 46 次；不加②③时 P1 会到 221 次。
  key_pattern: true
  # 按信号覆盖冷却期（交易日）。默认那三档是"级别"口径，对这两个信号不合适：
  # P1 默认只隔 1 天，而一段突破行情会连着好几天都长一个样，于是同一个信号连响四天。
  cooldown_days_by_signal:
    KEY_PATTERN_STRONG: 5
    KEY_PATTERN: 10

# 市场层（Beta）：回答"今天整体是什么行情"，用来决定**仓位与资产选择**，
# 不参与个股打分（那会变成用大盘给个股打分，两件事的证据强度完全不同）。
# 三块输入各代表一件事：宽基指数状态（趋势在不在）、市场广度（上涨有没有宽度）、
# 成交额（有没有量）。合成 0–1：0.5 中性、>0.6 进取、<0.4 防守。缺两块输入就不下结论。
market:
  indices: [SH000001, SH000300, SZ399006, SH000688]   # 大盘 / 大盘成长 / 小盘成长 / 硬科技
  weights: {index: 0.4, breadth: 0.4, amount: 0.2}
  amount_window: 60      # 成交额分位：跟过去多少个交易日的中位数比
  amount_low: 0.7        # 成交额 ÷ 中位数 ≤ 这个数 → 量能分算 0
  amount_high: 1.3       # ≥ 这个数 → 算 1
  # 资产选择：市场层 → 筛选池该偏向哪一类工具。
  # 只用来**排序和提示**（防守时宽基优先、进攻时个股优先），不改任何筛选口径——
  # 口径一改，"筛出来的票后来怎么样"就没法跨时间比了。
  asset_mix:
    defense: {broad_etf: 0.6, sector_etf: 0.1, stock: 0.3}
    neutral: {broad_etf: 0.4, sector_etf: 0.3, stock: 0.3}
    offense: {broad_etf: 0.2, sector_etf: 0.3, stock: 0.5}
  # 宽基名单：只有列在这里的 ETF 才算"宽基"（其余 ETF 一律当行业/主题）。
  # 靠名字猜不可靠——"中证 A500"、"科创 50"、"XX 龙头"都长得像宽基。想加就加一行。
  broad_etfs: [SH510300, SH510310, SH510330, SZ159919, SH510050,
               SH510500, SH512500, SH512100, SZ159845, SZ159915,
               SH588000, SH588080, SH510880]
  # ETF 简称关键词 → 它跟踪的指数代码。ETF 和指数的对应关系是发行时就定死的，
  # 我们没有那张表，只能按简称匹配；行业 ETF 不配（一个行业对应几十只指数，硬配会配错）。
  # 用来算"一级市场申赎 vs 二级市场涨跌"的背离：ETF 在赎回、指数却在涨，就是背离。
  benchmarks:
    上证50: SH000016
    沪深300: SH000300
    中证500: SH000905
    中证1000: SH000852
    科创50: SH000688
    科创100: SH000698
    科创板50: SH000688      # 简称里常写成"科创板50成份ETF"，别名要一起配
    科创板100: SH000698
    创业板: SZ399006
    深证100: SZ399330
    中证A500: SH000510
    上证红利: SH000015
  # 个股成交额集中度：缩量大涨时用来区分"存量抱团"还是"增量进场"。
  concentration:
    window: 60        # 和历史比多少个交易日（看分位，不看绝对值）
    top: 10           # 明细列成交额最大的几只
    big_amount: 5000000000   # "大票活跃"的计数门槛：单只成交额 ≥ 50 亿

# 疑似托底（"国家队"）：宽基 ETF **份额净流入 + 二级市场异常放量**，两条同时成立才记一笔。
# 份额来自一级市场申赎（真金白银申购才会增加），成交额来自二级市场换手——单独放量说明不了什么。
# 份额是 T+1 披露，所以这是**事后信号**（次日复盘用），做不了盘中实时。
support:
  etfs: [SH510300, SH510050, SH510500, SH512100, SH588000, SZ159919, SZ159915]
  shares_pct: 0.01          # 份额增幅阈值：1%
  amount_z: 2.0             # 成交额 z 分数阈值（相对前 20 个交易日）
  amount_ratio: 2.0         # 备选口径：今天成交额 ÷ 前 20 日均值 ≥ 2 倍（基准太平、z 算不出时用它）
  min_inflow: 200000000     # 单只最低净流入 2 亿元，挡掉小 ETF 的噪声
  multi_count: 3            # 同时命中这么多只 → 升 P1（齐步走）
  history_days: 60          # 页面上回看多少天

# 新股与次新：单独一张表（new_listings）+ 单独一个页面标签，推送里也会带一段。
# 判定用的是本地日线的第一根：同步一次要 750 天，只拿到 N 根就说明上市约 N 个交易日。
newstock:
  new_days: 30          # 上市 ≤ 30 个交易日算新股
  recent_days: 250      # ≤ 250 个交易日（约一年）算次新
  limit: 80             # 页面一次列多少只
  push_top: 6           # 推送里每类最多列几只
  types: [stock]        # 只看个股：新 ETF 天天有，混进来会把新股淹没

# 手机推送（PushPlus）。日终跑完自动把简报推到微信上。
# token 是敏感信息，**不要写在这个文件里**（这个文件进版本库）。
# 三种写法任选其一，优先级从高到低：
#   1) 本地文件 data/pushplus.token，内容就是 token（已被 .gitignore 排除）
#   2) 环境变量 ASHARE_PUSHPLUS_TOKEN
#   3) 直接写在这个文件里（不推荐，仅临时验证用）
notify:
  pushplus:
    enabled: true             # 关掉就完全不推送
    token: ""                 # 留空即可，token 放在本地文件里
    token_env: ASHARE_PUSHPLUS_TOKEN
    token_file: data/pushplus.token
    template: html            # html 在手机上是表格+徽章，txt 是等宽纯文本（对齐会散架）
    topic: ""                 # 一对多推送的群组编码，单发留空
    channel: ""               # 留空走微信；webhook / mail / sms 按 PushPlus 文档填
    only_on_alerts: false     # true = 只有真有提醒的日子才推（默认每天推一份简报）
    max_chars: 9000           # 正文超过这么长就截断（PushPlus 有长度上限；html 版更长）
    timeout: 10
    state_file: data/last-push.txt   # 记着上次推到哪个交易日，同一天不重复推

# AI 指标分析（阿里云百炼）。**只读旁注层**：模型读的是本地已经算好的数字，
# 它说的话不回写、不影响状态分和提醒——真相源只有一个，这点不能破。
# key 别写在这个文件里（进版本库），放 data/bailian.token 或环境变量。
analysis:
  bailian:
    enabled: true
    model: qwen-plus                          # qwen-plus / qwen-max / qwen3-max 都能用
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    token: ""                                 # 留空即可
    token_env: DASHSCOPE_API_KEY
    token_file: data/bailian.token
    max_tokens: 900
    temperature: 0.2                          # 低温度：让它老实读数字，别发挥
    timeout: 60
    daily_limit: 20                           # 每天最多真调用几次（0 = 不限制）；防手滑刷 token

# 全市场本地化：有空时把全市场的票拉到本地，之后每天只补最新一根。
# 历史回补逐只抓（可中断续跑）；每日增量用一次全市场快照搞定，不逐只请求。
warehouse:
  snapshot_daily: true        # 日终时用快照给观察池以外的股票补当日 K 线
  history_days: 750           # 首次回补拉多少天的历史
  batch_size: 800             # 单次最多补多少只（反复跑即可填满）

# 风险层：仓位上限与止损位怎么算（规格里风险层的出口就是这两个数）
risk:
  base_cap: {up: 0.8, range: 0.4, down: 0.0}   # 各状态下的基准仓位
  probe_cap: 0.3             # 下跌趋势里出现反转确认时的试探仓上限
  target_atr_pct: 2.0        # 目标波动率，实际波动比它大就等比减仓
  stop_buffer_pct: 0.5       # 止损放在支撑带下沿再往下留 0.5%
  atr_stop_multiple: 2.0     # 没有支撑带时，用 2 倍 ATR 当止损
  max_stop_pct: 8.0          # 止损离现价超过这么多就放弃（结构位太远时退到 ATR 止损）
  # 判断"够不够格"用的不是盈亏比，是期望值：期望(R) = 胜率 × 盈亏比 − (1 − 胜率)。
  # 只看盈亏比会误判——0.8 的盈亏比配 70% 胜率是赚的，3.0 配 20% 胜率是亏的。
  # 胜率由回测给出建议值（跑 backtest 会打印），期望 ≤ 0 直接 0 仓。
  win_rate: 0.5
  target_expectancy: 0.5     # 期望达到这么多 R 给满缩放，低于它按比例缩
  # 上方没有阻力带的两种情况，处理方式不同：
  #   贴近 250 日高点（容差内）→ 上方本来是真空，用 N 倍 ATR 估目标，别把创新高的票排除掉
  #   其余                    → 数据不足，按保守倍数算，宁可不做
  open_space_high_tolerance_pct: 8.0
  open_space_atr_multiple: 3.0
  no_resistance_rr: 1.0
  cap_floor: 0.3             # 缩放系数的下限，避免直接归零
  # 结构低点止损：摆动低点（左右各 2 根确认的分型）是**没被平滑过**的支撑，
  # 比成交量密集带更贴近这一波行情。它只用来收紧止损——和支撑带/ATR 取更近的那个，
  # 所以不会把止损放得更远；配置里可以整条关掉。
  structure_stop:
    enabled: true
    max_age: 60        # 结构低点超过 60 根就不算数
    buffer_pct: 0.5    # 在结构低点下方再留 0.5%
    min_risk_pct: 1.0  # 离现价不足 1% 的止损是噪声，不采用
  # 换手放量折价（负向信号 → 走风险层，不进状态分）。
  # 门槛定在 3 倍而不是 2 倍，是照证据来的（400 只标的、2.1 年、12.9 万样本，
  # 按交易日聚合后）：
  #   2~3 倍   20 日超额 −0.38%，t = −1.53   → 偏弱，但不够硬，不足以据此动手
  #   >3 倍    20 日超额 −1.29%，t = −3.13   → 这条是真的
  # 只缩仓位、不否决——它是"少做一点"的证据，不是"不能做"。
  turnover_discount:
    enabled: true
    ratio: 3.0            # 触发门槛：当日换手 ÷ 近 20 日常态（证据最硬的那一档）
    factor: 0.6           # 仓位上限乘这个系数
    high_position_pct: null   # 想只在高位放量时打折就填 5（距 250 日高点 5% 以内）；null = 不设这个条件

# 值得盯的形态：筛选条件全部写成数据，加一条就是加一段配置，不用改代码。
# 支持的运算：== != > >= < <= between in not_in contains startswith exists
#   - value: 固定值         - compare: 与另一字段比（可带 factor 系数）
#   - value: [a, b] 配 between 表示区间
# sort 是排序字段（默认降序）；why 是给人看的说明，会显示在页面和报告里。
# 市场广度（涨跌家数 / 涨跌停 / 中位数涨跌幅）：用本地 K 线自己数，不联网。
# 样本少于 min_coverage 只时不写入——99 只票算出来的"涨跌家数"不是广度，是噪声。
breadth:
  min_coverage: 1000

# 参数回测：样本口径与摩擦成本。
# 默认全市场抽样——十来只票、几十次信号的**标准误比要比较的差距还大**，
# 那种数字不能用来改参数。抽样的种子固定，所以同一份数据每次抽到同一批票，结果可复现。
backtest:
  universe: market        # market 全市场抽样 / watchlist 只看观察池（口径同早期版本）
  sample: 400             # 全市场时抽多少只；越多越稳，耗时线性增长
  seed: 20260917          # 固定种子
  min_bars: 120           # 至少多少根日线才参与（要留出均线、关键带和前瞻收益的空间）
  limit_check: true       # 建仓日一字涨停买不进、到期日跌停卖不掉，都不算你的收益
  exit_delay_max: 3       # 到期日跌停封死时，最多顺延几个交易日再卖
  cost:                   # 往返摩擦成本：信号和基准都扣同一笔，否则比的是谁摩擦小
    commission_bps: 2.5   # 单边佣金，万分之 2.5
    stamp_bps: 5.0        # 印花税，卖出单边千分之 0.5
    transfer_bps: 0.1     # 过户费，双边

screen:
  min_bars: 80               # 至少多少根日线才参与筛选
  top: 30                    # 每个条件保留多少条
  # priority 只决定"一只票同时命中多个条件时，拿哪个当主标签"（数字越小越具体）。
  # 底层记录一条都不删——一只票同时是"突破"和"异动"是有信息量的，
  # 只是页面和报告不该把同一只票在五个分组里各刷一遍。
  # 经验顺序：先看已经发生的动作（突破/反转），再看位置（回踩/蓄势/横盘），
  # 最后才是宽泛的状态描述（趋势）。
  criteria:
    - key: 反转
      priority: 20
      title: 下跌/震荡里出现放量长阳等反转确认
      why: 均线和 ATR 天生滞后，转折点上先动的是 K 线形态
      sort: body_pct
      when:
        - {field: state, op: "!=", value: up}
        - {field: candle.reversal_up, op: "==", value: true}
        - {field: close, op: "<=", compare: ma20, factor: 1.12}

    - key: 低位横盘
      priority: 60
      title: 跌下来之后横着缩量，等打底
      why: 和高位蓄势形态一样，但含义不同——它在均线下方，是打底不是蓄势突破
      sort: vol_shrink_ratio
      desc: false            # 缩量越狠越靠前
      when:
        - {field: consolidation_days, op: ">=", value: 20}
        - {field: vol_shrink_ratio, op: "<=", value: 0.7}
        - {field: close, op: "<=", compare: ma60, factor: 1.0}
        - {field: state, op: "!=", value: up}

    - key: 蓄势
      priority: 40
      title: 缩量横盘且贴着高位，等方向
      why: 高位缩量横盘之后往往跟着方向选择，向上突破的概率取决于量能是否恢复
      sort: vol_shrink_ratio
      desc: false            # 缩量越狠越靠前
      when:
        - {field: consolidation_days, op: ">=", value: 20}
        - {field: vol_shrink_ratio, op: "<=", value: 0.6}
        - {field: close, op: ">", compare: ma60, factor: 1.02}
        - {field: state, op: "!=", value: down}

    - key: 突破
      priority: 10
      title: 放量突破区间上沿
      why: 突破要放量才算数，缩量突破多半是假突破
      sort: vol_ratio_20
      when:
        - {field: breakout_confirmed, op: "==", value: 1}

    # 异动拆成阳线 / 阴线两个条件：同样是"成交额放大到 3 倍"，放量长阳可能是资金进场，
    # 放量长阴多半是派发或者出了事——这两件事的性质完全相反，混在一个标签里没法用。
    # 两个条件是互斥的（实体涨跌幅 ≥0 / <0），不会重复占位。
    - key: 放量阳线异动
      priority: 50
      title: 成交额放大到 3 倍以上，且收阳
      why: 放量上涨说明有资金在买；同样放量但收阴，含义正好相反（见下一条）
      sort: vol_ratio_20
      when:
        - {field: vol_ratio_20, op: ">=", value: 3}
        - {field: candle.body_pct, op: ">=", value: 0}

    - key: 放量阴线异动
      priority: 55
      title: 成交额放大到 3 倍以上，且收阴
      why: 放量下跌通常是派发或者消息面有变，值得先看一眼再说
      sort: vol_ratio_20
      when:
        - {field: vol_ratio_20, op: ">=", value: 3}
        - {field: candle.body_pct, op: "<", value: 0}

    - key: 趋势
      priority: 90
      title: 上升趋势里趋势分最高
      why: 顺势标的的容错率更高
      sort: trend_score
      when:
        - {field: state, op: "==", value: up}
        - {field: trend_score, op: "exists", value: true}

    - key: 回踩
      priority: 30
      title: 上升趋势里回踩到关键带附近
      why: 上升趋势中的回踩是低吸位置，但前提是支撑有效
      sort: trend_score
      when:
        - {field: state, op: "==", value: up}
        - {field: raw_values.dist_to_level, op: "between", value: [-1.5, 1.5]}

# 观察池候选：从筛选结果里挑"值得进池子盯着"的票（只读本地数据，不会自己改观察池）。
# 指数和 ETF 是固定配置，不参与轮换；这里排的是个股那一档。
candidates:
  days: 20        # 回看多少个筛选日
  top: 20         # 打印多少条候选
  min_hits: 2     # 至少被命中几次才算候选（1 次是噪声）

# 指标台账：role = primary / modifier / veto；status = candidate / shadow / active / retired
# 类别权重预算：trend ≤ 0.40，structure ≤ 0.20，volume ≤ 0.25，volatility ≤ 0.15，fund+sentiment ≤ 0.10
factors:
  - factor_id: ma_slope
    name: 均线斜率
    layer: state
    role: primary
    category: trend
    weight: 0.25
    min_samples: 120
    status: active
    source_field: ma_slope_20
    normalize: {type: linear, x0: -3.0, x1: 3.0}

  - factor_id: ma_align
    name: 均线排列
    layer: state
    role: primary
    category: trend
    weight: 0.15
    min_samples: 120
    status: active
    source_field: ma_align
    normalize: {type: linear, x0: -1.0, x1: 1.0}

  - factor_id: vol_confirm
    name: 量能配合
    layer: state
    role: modifier
    category: volume
    weight: 0.20
    min_samples: 60
    status: active
    source_field: vol_confirm
    normalize: {type: linear, x0: -1.5, x1: 1.5}

  - factor_id: atr_pct
    name: 波动率
    layer: state
    role: modifier
    category: volatility
    weight: 0.15
    min_samples: 60
    status: active
    source_field: atr_pct
    normalize: {type: linear, x0: 5.0, x1: 1.0}   # 反向：波动越小得分越高

  - factor_id: donchian
    name: 通道突破
    layer: state
    role: modifier
    category: structure
    weight: 0.15
    min_samples: 60
    status: active
    source_field: donchian_break
    normalize: {type: linear, x0: -1.0, x1: 1.0}

  - factor_id: dist_to_level
    name: 距关键带距离
    layer: state
    role: modifier
    category: structure
    weight: 0.05
    min_samples: 60
    status: active
    source_field: dist_to_level
    normalize: {type: linear, x0: -2.0, x1: 2.0}

  # 影子运行：只记录贡献分，不参与打分（准入流程第 4 步）
  - factor_id: adx
    name: ADX
    layer: state
    role: modifier
    category: trend
    weight: 0.0
    min_samples: 60
    status: shadow
    source_field: adx14
    normalize: {type: linear, x0: 15.0, x1: 40.0}

  - factor_id: breadth
    name: 市场广度
    layer: state
    role: modifier
    category: sentiment
    weight: 0.0
    min_samples: 120
    status: shadow
    source_field: breadth_score
    normalize: {type: linear, x0: -1.0, x1: 1.0}

  # 连板高度：市场情绪的另一个读法。广度回答"多少家涨"，
  # 连板高度回答"最强的资金还在不在"——两个都放观察期，先记录不计分。
  - factor_id: board_streak
    name: 连板高度
    layer: state
    role: modifier
    category: sentiment
    weight: 0.0
    min_samples: 120
    status: shadow
    source_field: max_boards
    normalize: {type: linear, x0: 0.0, x1: 8.0}

  - factor_id: etf_share
    name: ETF 份额变化
    layer: state
    role: modifier
    category: fund
    weight: 0.0
    min_samples: 60
    status: shadow
    source_field: etf_share_chg
    normalize: {type: linear, x0: -0.03, x1: 0.03}

  # 换手率的两条读法：都先进影子（权重 0，只记录不参与打分）。
  # 为什么先影子：换手率对**反转**的意义多半是"越高之后越弱"，也就是负 IC；
  # 而台账的转正判定现在只认正向（ic20 < 0 会判"方向是反的"）。所以先跑 20 个交易日，
  # 用它把真实 IC 和与现有因子的相关性量出来，再决定走风险层折价还是给台账加 direction。
  - factor_id: turnover_ratio
    name: 换手放量倍数
    layer: state
    role: modifier
    category: volume
    weight: 0.0
    min_samples: 60
    status: shadow
    source_field: turnover_ratio
    normalize: {type: linear, x0: 0.5, x1: 2.5}

  - factor_id: turnover_20d
    name: 常态换手率
    layer: state
    role: modifier
    category: volume
    weight: 0.0
    min_samples: 60
    status: shadow
    source_field: turnover_20d
    normalize: {type: linear, x0: 1.0, x1: 8.0}

  # 摆动结构：更高的高点 + 更高的低点。均线是平滑后的价格，结构是没被平滑过的原始序列，
  # 两者相关性高不高（残差 IC 会不会被吃掉）正是要看的——先影子，不进打分。
  - factor_id: swing_state
    name: 摆动结构
    layer: state
    role: modifier
    category: structure
    weight: 0.0
    min_samples: 120
    status: shadow
    source_field: swing_state
    normalize: {type: linear, x0: -1.0, x1: 1.0}

  - factor_id: dist_to_swing_low
    name: 距结构低点
    layer: state
    role: modifier
    category: structure
    weight: 0.0
    min_samples: 120
    status: shadow
    source_field: dist_to_swing_low
    normalize: {type: linear, x0: -12.0, x1: -1.0}   # 越贴近结构低点得分越高：止损近，盈亏比才好

  # 市场层（Beta）：宽基指数状态 + 市场广度 + 成交额，合成一个 0–1（0.5 中性）。
  # 它回答的是"今天该用多大仓位"，不是"买哪只票"——所以只走风险层与筛选池的资产选择，
  # 不进个股趋势分。先当影子跑够样本，看"市场层高的日子，我们的信号是不是真的更好"。
  - factor_id: market_regime
    name: 市场层（Beta）
    layer: state
    role: modifier
    category: sentiment
    weight: 0.0
    min_samples: 120
    status: shadow
    source_field: market_regime
    normalize: {type: linear, x0: 0.3, x1: 0.7}
